---
- name: Check bootstrap status
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig
      OC={{ oc_bin }}
      NOW=$(date +%H:%M)
      ELAPSED=$(( ({{ _tick }} + 1) * 5 ))

      # Approve any pending CSRs (workers need this to join)
      PENDING=$($OC get csr -o go-template='{% raw %}{{range .items}}{{if not .status}}{{.metadata.name}} {{end}}{{end}}{% endraw %}' 2>/dev/null || echo "")
      if [ -n "$PENDING" ]; then
        echo "$PENDING" | xargs $OC adm certificate approve 2>/dev/null
      fi

      API_VER=$(curl -sk --max-time 5 \
        https://api.{{ cluster_name }}.{{ cluster_base_domain }}:6443/version 2>/dev/null \
        | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('gitVersion',''))" \
        2>/dev/null || echo "")

      if [ -z "$API_VER" ]; then
        echo "[$NOW ${ELAPSED}m] API: waiting... | Masters: - | etcd: - | Operators: - | Bootstrap: pending"
        echo "BOOTSTRAP_SAFE=false"
        exit 0
      fi

      NODES_RAW=$($OC get nodes --no-headers 2>/dev/null || echo "")
      MASTERS_TOTAL=$(echo "$NODES_RAW" | grep -c master 2>/dev/null || echo 0)
      MASTERS_READY=$(echo "$NODES_RAW" | grep master | grep -c " Ready" 2>/dev/null || echo 0)

      ETCD_PODS=$($OC get pods -n openshift-etcd -l app=etcd --no-headers 2>/dev/null \
        | grep -c Running || echo 0)
      ETCD_CO=$($OC get co etcd -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}' \
        2>/dev/null || echo "")
      if echo "$ETCD_CO" | grep -q "Available=True"; then
        ETCD_ST="healthy (${ETCD_PODS})"
      elif [ "$ETCD_PODS" -gt 0 ]; then
        ETCD_ST="forming (${ETCD_PODS})"
      else
        ETCD_ST="waiting"
      fi

      SKIP="insights"
      CO_TOTAL=$($OC get co --no-headers 2>/dev/null | grep -v "^${SKIP} " | wc -l || echo 0)
      AVAIL_TMPL='{% raw %}{{range .items}}{{if ne .metadata.name "insights"}}'
      AVAIL_TMPL+='{{range .status.conditions}}'
      AVAIL_TMPL+='{{if eq .type "Available"}}{{if eq .status "True"}}+{{end}}'
      AVAIL_TMPL+='{{end}}{{end}}{{end}}{{end}}{% endraw %}'
      CO_AVAIL=$($OC get co -o go-template="$AVAIL_TMPL" 2>/dev/null \
        | grep -o '+' | wc -l || echo 0)
      WAIT_TMPL='{% raw %}{{range .items}}{{$n := .metadata.name}}'
      WAIT_TMPL+='{{if ne $n "insights"}}{{range .status.conditions}}'
      WAIT_TMPL+='{{if eq .type "Available"}}'
      WAIT_TMPL+='{{if ne .status "True"}}{{$n}} {{end}}'
      WAIT_TMPL+='{{end}}{{end}}{{end}}{{end}}{% endraw %}'
      CO_WAITING=$($OC get co -o go-template="$WAIT_TMPL" 2>/dev/null || echo "")

      BOOT_CM=$($OC get cm bootstrap -n kube-system \
        -o jsonpath='{.data.status}' 2>/dev/null || echo "")
      [ "$BOOT_CM" = "complete" ] && BOOT_ST="complete" || BOOT_ST="in progress"

      ETCD_BOOT_GONE="false"
      if [ "$BOOT_CM" = "complete" ]; then
        if ! $OC get pods -n openshift-etcd --no-headers 2>/dev/null | grep -qi bootstrap; then
          ETCD_BOOT_GONE="true"
        fi
      fi

      MSG="[$NOW ${ELAPSED}m] API: $API_VER | Masters: ${MASTERS_READY}/${MASTERS_TOTAL} Ready"
      MSG+=" | etcd: $ETCD_ST | Operators: ${CO_AVAIL}/${CO_TOTAL} | Bootstrap: $BOOT_ST"
      echo "$MSG"
      if [ -n "$CO_WAITING" ] && [ "$CO_TOTAL" -gt 0 ]; then
        echo "  Waiting for: $CO_WAITING"
      fi

      if [ "$BOOT_CM" = "complete" ] && [ "$ETCD_BOOT_GONE" = "true" ]; then
        echo "  Bootstrap handoff complete. Safe to remove bootstrap VM."
        echo "BOOTSTRAP_SAFE=true"
      else
        if [ "$BOOT_CM" = "complete" ] && [ "$ETCD_BOOT_GONE" = "false" ]; then
          echo "  Bootstrap configmap complete, waiting for etcd member removal..."
        fi
        echo "BOOTSTRAP_SAFE=false"
      fi
    executable: /bin/bash
  register: cluster_boot_tick
  changed_when: false

- name: "{{ cluster_boot_tick.stdout_lines[0] | default('Checking...') }}"
  ansible.builtin.debug:
    msg: "{{ cluster_boot_tick.stdout }}"

- name: Set bootstrap completion flag
  ansible.builtin.set_fact:
    cluster_bootstrap_safe: "{{ 'BOOTSTRAP_SAFE=true' in cluster_boot_tick.stdout }}"

- name: Wait before next check
  ansible.builtin.pause:
    seconds: 300
  when: not cluster_bootstrap_safe
