---
# For SNO (master_count=1, worker_count=0): Bootstrap-In-Place (BIP)
#   - openshift-install create single-node-ignition-config
#   - produces: bootstrap-in-place-for-live-iso.ign (merged bootstrap+master)
#   - no separate bootstrap.ign / master.ign needed
#
# For multi-node (master_count>1 or worker_count>0): standard UPI
#   - openshift-install create ignition-configs
#   - produces: bootstrap.ign, master.ign, worker.ign separately

- name: Set install mode (SNO=BIP, multi-node=UPI)
  ansible.builtin.set_fact:
    _cluster_is_sno: "{{ master_count | int == 1 and worker_count | int == 0 }}"

- name: Set ignition check path based on install mode
  ansible.builtin.set_fact:
    _cluster_ignition_check_path: >-
      {{ (cluster_dir + '/bootstrap-in-place-for-live-iso.ign')
         if _cluster_is_sno
         else (cluster_dir + '/bootstrap.ign') }}

- name: Check if ignition configs already exist
  ansible.builtin.stat:
    path: "{{ _cluster_ignition_check_path }}"
  register: _cluster_ignition_check

- name: Generate ignition configs
  when: not _cluster_ignition_check.stat.exists
  block:
    - name: Create cluster directory
      ansible.builtin.file:
        path: "{{ cluster_dir }}"
        state: directory
        mode: '0755'

    - name: Read pull secret
      ansible.builtin.set_fact:
        _cluster_pull_secret: "{{ lookup('file', ocp_pull_secret_file) | trim }}"

    - name: Read SSH public key
      ansible.builtin.set_fact:
        _cluster_ssh_pubkey: "{{ lookup('file', ocp_ssh_pubkey_file) | trim }}"

    - name: Fetch registry CA certificate from infra VM
      block:
        - name: Fetch CA cert from infra VM
          ansible.builtin.fetch:
            src: /opt/registry/certs/ca.crt
            dest: /tmp/registry-ca.crt
            flat: true
          delegate_to: infra_host

        - name: Read registry CA certificate
          ansible.builtin.set_fact:
            _cluster_registry_ca_bundle: "{{ lookup('file', '/tmp/registry-ca.crt') }}"

    - name: Generate install-config.yaml
      ansible.builtin.template:
        src: install-config.yaml.j2
        dest: "{{ cluster_dir }}/install-config.yaml"
        mode: '0600'
      vars:
        ocp_pull_secret: "{{ _cluster_pull_secret }}"
        ocp_ssh_pubkey: "{{ _cluster_ssh_pubkey }}"

    - name: Back up install-config.yaml (consumed by openshift-install)
      ansible.builtin.copy:
        src: "{{ cluster_dir }}/install-config.yaml"
        dest: "{{ cluster_dir }}/install-config.yaml.bak"
        mode: '0600'
        remote_src: true

    - name: "[SNO/BIP] Generate single-node ignition config"
      when: _cluster_is_sno
      ansible.builtin.command:
        cmd: "{{ openshift_install_bin }} create single-node-ignition-config --dir={{ cluster_dir }}"
      changed_when: true

    - name: "[UPI] Generate ignition configs (bootstrap + master + worker)"
      when: not _cluster_is_sno
      ansible.builtin.command:
        cmd: "{{ openshift_install_bin }} create ignition-configs --dir={{ cluster_dir }}"
      changed_when: true

- name: "[SNO/BIP] Verify BIP ignition file exists"
  when: _cluster_is_sno
  ansible.builtin.stat:
    path: "{{ cluster_dir }}/{{ item }}"
  register: _cluster_ign_files_sno
  loop:
    - bootstrap-in-place-for-live-iso.ign
    - auth/kubeconfig
    - auth/kubeadmin-password
  failed_when: not _cluster_ign_files_sno.stat.exists

- name: "[UPI] Verify UPI ignition files exist"
  when: not _cluster_is_sno
  ansible.builtin.stat:
    path: "{{ cluster_dir }}/{{ item }}"
  register: _cluster_ign_files_upi
  loop:
    - bootstrap.ign
    - master.ign
    - worker.ign
    - auth/kubeconfig
    - auth/kubeadmin-password
  failed_when: not _cluster_ign_files_upi.stat.exists
