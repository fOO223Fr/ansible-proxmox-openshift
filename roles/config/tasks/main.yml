---
- name: Wait for all cluster operators to be available
  kubernetes.core.k8s_info:
    kind: ClusterOperator
    kubeconfig: "{{ playbook_dir }}/../kubeconfig"
  register: _config_operators
  until: >
    _config_operators.resources |
    selectattr('status.conditions', 'defined') |
    map(attribute='status.conditions') |
    flatten |
    selectattr('type', 'equalto', 'Available') |
    selectattr('status', 'equalto', 'True') |
    list | length == _config_operators.resources | length
  retries: 60
  delay: 30

- name: Get cluster version
  kubernetes.core.k8s_info:
    kind: ClusterVersion
    name: version
    kubeconfig: "{{ playbook_dir }}/../kubeconfig"
  register: _config_version

- name: Display cluster status
  ansible.builtin.debug:
    msg:
      - "All cluster operators available"
      - "Cluster version: {{ _config_version.resources[0].status.desired.version }}"
      - "Cluster ID: {{ _config_version.resources[0].spec.clusterID }}"

# ── Custom kubeadmin password ────────────────────────────────
- name: Set custom kubeadmin password
  when: ocp_kubeadmin_password_file | default('') | length > 0
  block:
    - name: Read custom kubeadmin password
      ansible.builtin.set_fact:
        _config_kubeadmin_pw: "{{ lookup('file', ocp_kubeadmin_password_file) | trim }}"
      no_log: true

    - name: Generate bcrypt hash of custom password
      ansible.builtin.command:
        cmd: >-
          python3 -c "import bcrypt;
          print(bcrypt.hashpw('{{ _config_kubeadmin_pw }}'.encode(),
          bcrypt.gensalt()).decode())"
      register: _config_pw_hash
      changed_when: false
      no_log: true

    - name: Update kubeadmin secret with custom password
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/../kubeconfig"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kubeadmin
            namespace: kube-system
          data:
            kubeadmin: "{{ _config_pw_hash.stdout | b64encode }}"
      no_log: true

    - name: Update cluster-credentials.txt
      ansible.builtin.copy:
        content: |
          Console: https://console-openshift-console.apps.{{ cluster_name }}.{{ cluster_base_domain }}
          Username: kubeadmin
          Password: {{ _config_kubeadmin_pw }}
        dest: "{{ playbook_dir }}/../cluster-credentials.txt"
        mode: '0600'
      no_log: true

    - name: Custom kubeadmin password set
      ansible.builtin.debug:
        msg: "kubeadmin password updated from {{ ocp_kubeadmin_password_file }}"
